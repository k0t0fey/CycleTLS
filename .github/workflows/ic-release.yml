name: Inspect npm OIDC exchange
on:
  push:
    branches: ['codex/oidc-diagnostic']
permissions: {}
jobs:
  inspect:
    if: github.repository == 'k0t0fey/CycleTLS'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect OIDC claims and exact package token exchange without publishing
        shell: bash
        run: |
          node <<'NODE'
          const emit = (result) => console.log(JSON.stringify(result));
          const audience = 'npm:registry.npmjs.org';
          const packageName = '@k0t0fey/cycletls';
          const workflow = 'k0t0fey/CycleTLS/.github/workflows/ic-release.yml@refs/heads/codex/oidc-diagnostic';
          const categories = (data) => {
            const message = [data?.code, data?.message, data?.error].filter((v) => typeof v === 'string').join(' ').toLowerCase();
            return ['not found', 'permission', 'trust', 'expired', 'audience', 'issuer', 'repository', 'workflow', 'environment', 'token', 'stage_required'].filter((value) => message.includes(value));
          };
          const knownError = (data) => {
            const expected = 'oidc token exchange error - package not found';
            return [data?.message, data?.error].some((value) => typeof value === 'string' && value.trim().toLowerCase().replace(/\s+/g, ' ') === expected) ? 'OIDC token exchange error - package not found' : 'unrecognized_response';
          };
          async function request(url, authorization, method = 'GET') {
            const response = await fetch(url, { method, redirect: 'error', signal: AbortSignal.timeout(15000), headers: { accept: 'application/json', authorization: `Bearer ${authorization}` } });
            const data = await response.json().catch(() => null);
            return { response, data };
          }
          (async () => {
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            if (url.protocol !== 'https:') throw new Error('INVALID_IDENTITY_URL');
            url.searchParams.set('audience', audience);
            const identity = await request(url, process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN);
            emit({ phase: 'github_identity', httpStatus: identity.response.status, tokenPresent: typeof identity.data?.value === 'string' });
            if (!identity.response.ok || !identity.data?.value) throw new Error('IDENTITY_UNAVAILABLE');
            const claims = JSON.parse(Buffer.from(identity.data.value.split('.')[1], 'base64url').toString('utf8'));
            const keys = ['iss', 'aud', 'sub', 'repository', 'repository_id', 'repository_owner', 'repository_owner_id', 'ref', 'sha', 'workflow_ref', 'workflow_sha', 'job_workflow_ref', 'job_workflow_sha', 'environment', 'runner_environment', 'event_name'];
            emit({ phase: 'claims', claims: Object.fromEntries(keys.map((key) => [key, typeof claims[key] === 'string' ? claims[key] : null])), releasePackage: { name: packageName, version: '2.0.5-ic.3', sourceCommit: 'a29551249110168f077269775b11c2389fe64bff' }, diagnosticRefDiffersFromReleaseTag: true });
            if (claims.iss !== 'https://token.actions.githubusercontent.com' || claims.aud !== audience || claims.repository !== 'k0t0fey/CycleTLS' || claims.workflow_ref !== workflow) throw new Error('IDENTITY_MISMATCH');
            const exchange = await request('https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@k0t0fey%2fcycletls', identity.data.value, 'POST');
            emit({ phase: 'npm_exchange', httpStatus: exchange.response.status, tokenIssued: typeof exchange.data?.token === 'string', tokenType: exchange.data?.token_type === 'oidc' ? 'oidc' : null, errorCategories: categories(exchange.data), knownError: knownError(exchange.data), provesPublishPermission: false });
            if (exchange.response.status !== 201 || typeof exchange.data?.token !== 'string') process.exitCode = 1;
          })().catch(() => { emit({ phase: 'diagnostic', error: 'REQUEST_OR_IDENTITY_VALIDATION_FAILED' }); process.exitCode = 1; });
          NODE
