name: Inspect CycleTLS staged release
on:
  workflow_dispatch:
  push:
    branches: [codex/consumer-checkout]
    paths: [.github/workflows/ic-stage-diagnostic.yml]
permissions: {}
jobs:
  inspect:
    if: github.repository == 'k0t0fey/CycleTLS'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Read only exact package registry and stage metadata
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CYCLETLS }}
        shell: bash
        run: |
          node <<'NODE'
          'use strict';

          const REGISTRY = 'https://registry.npmjs.org';
          const PACKAGE = '@k0t0fey/cycletls';
          const VERSION = '2.0.5-ic.2';
          const UUID = /^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i;
          const ISO = /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d{1,3})?Z$/;

          function schemaKeys(value) {
            if (!value || typeof value !== 'object') return [];
            return Object.keys(value)
              .filter((key) => /^[A-Za-z][A-Za-z0-9_]{0,39}$/.test(key))
              .sort()
              .slice(0, 40);
          }

          function stageMetadata(item) {
            if (item?.packageName !== PACKAGE || item?.version !== VERSION) return null;
            return {
              packageName: PACKAGE,
              version: VERSION,
              id: typeof item.id === 'string' && UUID.test(item.id) ? item.id : null,
              status:
                typeof item.status === 'string' && /^[a-z][a-z_]{0,63}$/.test(item.status)
                  ? item.status
                  : null,
              createdAt:
                typeof item.createdAt === 'string' && ISO.test(item.createdAt)
                  ? item.createdAt
                  : null,
              shasum:
                typeof item.shasum === 'string' && /^[a-f0-9]{40}$/i.test(item.shasum)
                  ? item.shasum
                  : null,
            };
          }

          async function inspect({ token, fetchImpl = fetch, now = () => new Date() }) {
            const requests = [];
            async function get(path, authenticated = false) {
              const url = new URL(path, REGISTRY);
              if (url.origin !== REGISTRY) throw new Error('INVALID_REGISTRY');
              const headers = { accept: 'application/json' };
              if (authenticated) headers.authorization = `Bearer ${token}`;
              try {
                const response = await fetchImpl(url.href, {
                  method: 'GET',
                  headers,
                  redirect: 'error',
                  signal: AbortSignal.timeout(15000),
                });
                const outcome = { httpStatus: response.status };
                requests.push({ path: url.pathname, authenticated, ...outcome });
                if (!response.ok) {
                  await response.body?.cancel();
                  return outcome;
                }
                const reader = response.body.getReader();
                let size = 0;
                const chunks = [];
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  size += value.length;
                  if (size > 2 * 1024 * 1024) {
                    await reader.cancel();
                    return { ...outcome, error: 'RESPONSE_TOO_LARGE' };
                  }
                  chunks.push(Buffer.from(value));
                }
                try {
                  return {
                    ...outcome,
                    data: JSON.parse(Buffer.concat(chunks).toString('utf8')),
                  };
                } catch {
                  return { ...outcome, error: 'INVALID_JSON' };
                }
              } catch {
                requests.push({
                  path: url.pathname,
                  authenticated,
                  error: 'NETWORK_OR_REDIRECT_ERROR',
                });
                return { error: 'NETWORK_OR_REDIRECT_ERROR' };
              }
            }

            const report = {
              observedAt: now().toISOString(),
              packageName: PACKAGE,
              version: VERSION,
              mode: 'READ_ONLY_REGISTRY_GET',
            };
            const publicVersion = await get(`/${encodeURIComponent(PACKAGE)}/${VERSION}`);
            report.publicVersion = {
              httpStatus: publicVersion.httpStatus ?? null,
              error: publicVersion.error ?? null,
              exactVersionPresent:
                publicVersion.data?.name === PACKAGE &&
                publicVersion.data?.version === VERSION,
            };
            const publicPackage = await get(`/${encodeURIComponent(PACKAGE)}`);
            report.publicPackage = {
              httpStatus: publicPackage.httpStatus ?? null,
              error: publicPackage.error ?? null,
              versions:
                publicPackage.data?.name === PACKAGE
                  ? Object.keys(publicPackage.data?.versions ?? {}).filter((v) =>
                      /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(v),
                    )
                  : [],
              createdAt:
                typeof publicPackage.data?.time?.created === 'string' &&
                ISO.test(publicPackage.data.time.created)
                  ? publicPackage.data.time.created
                  : null,
            };
            if (!token) {
              report.auth = { error: 'CYCLETLS_SECRET_MISSING' };
              return { ...report, requests };
            }
            const identity = await get('/-/whoami', true);
            const username = identity.data?.username;
            report.identity = {
              httpStatus: identity.httpStatus ?? null,
              error: identity.error ?? null,
              username:
                typeof username === 'string' && /^[a-z0-9][a-z0-9._-]{0,99}$/i.test(username)
                  ? username
                  : null,
            };
            if (identity.data && !report.identity.username) {
              report.identity.schemaKeys = schemaKeys(identity.data);
            }

            const matches = [];
            report.stageList = { complete: false, pages: [], matches };
            for (let page = 0; page < 5; page++) {
              const query = new URLSearchParams({
                page: String(page),
                perPage: '100',
                package: PACKAGE,
              });
              const response = await get(`/-/stage?${query}`, true);
              const info = {
                page,
                httpStatus: response.httpStatus ?? null,
                error: response.error ?? null,
              };
              report.stageList.pages.push(info);
              if (!response.data) break;
              const { items, total } = response.data;
              if (!Array.isArray(items) || !Number.isSafeInteger(total) || total < 0) {
                info.error = 'UNKNOWN_STAGE_LIST_SCHEMA';
                info.schemaKeys = schemaKeys(response.data);
                break;
              }
              info.targetPackageCount = items.filter(
                (item) => item?.packageName === PACKAGE,
              ).length;
              // Do not print other packages, actors, emails, raw payloads or response errors.
              for (const item of items) {
                const metadata = stageMetadata(item);
                if (metadata) matches.push(metadata);
              }
              if (items.length < 100 || (page + 1) * 100 >= total) {
                report.stageList.complete = true;
                break;
              }
            }
            if (!report.stageList.complete) {
              report.stageList.limitation = 'LIST_INCOMPLETE_OR_NOT_AUTHORIZED';
            }
            report.stageViews = [];
            for (const metadata of matches.slice(0, 5)) {
              if (!metadata.id) continue;
              const response = await get(`/-/stage/${metadata.id}`, true);
              const detail = {
                id: metadata.id,
                httpStatus: response.httpStatus ?? null,
                error: response.error ?? null,
              };
              const exact = stageMetadata(response.data);
              if (exact?.id === metadata.id) {
                detail.metadata = exact;
              } else if (response.data) {
                detail.error = 'UNEXPECTED_STAGE_VIEW_SCHEMA_OR_IDENTITY';
                detail.schemaKeys = schemaKeys(response.data);
              }
              report.stageViews.push(detail);
            }
            report.limitations = [
              'Published availability requires exact public version metadata.',
              'An empty authorized stage list does not prove a previous publish succeeded or that the version can be reused.',
              'HTTP authorization errors do not mean that no staged version exists.',
            ];
            return { ...report, requests };
          }

          async function main() {
            const token = process.env.NODE_AUTH_TOKEN || '';
            try {
              const report = await inspect({ token });
              let output = JSON.stringify(report, null, 2);
              if (token) output = output.split(token).join('[REDACTED]');
              process.stdout.write(`${output}\n`);
              if (
                !token ||
                report.identity?.httpStatus !== 200 ||
                !report.stageList?.complete ||
                report.stageViews?.some((view) => view.httpStatus !== 200 || view.error)
              ) {
                process.exitCode = 1;
              }
            } catch {
              process.stderr.write('STAGE_DIAGNOSTIC_UNEXPECTED_ERROR\n');
              process.exitCode = 1;
            }
          }

          module.exports = { inspect, stageMetadata, schemaKeys };
          main();

          NODE
